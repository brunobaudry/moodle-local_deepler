name: Moodle Plugin CI
on:
  push:
    branches: [ dev ]
jobs:
  testMaria:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb_version }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.4
            moodle-branch: MOODLE_502_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.3
            moodle-branch: MOODLE_502_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.2
            moodle-branch: MOODLE_502_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.4
            moodle-branch: MOODLE_501_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.3
            moodle-branch: MOODLE_501_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.2
            moodle-branch: MOODLE_501_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.4
            moodle-branch: MOODLE_500_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.3
            moodle-branch: MOODLE_500_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.2
            moodle-branch: MOODLE_500_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.3
            moodle-branch: MOODLE_405_STABLE
            database: mariadb
            mariadb_version: 10.11
          - php: 8.2
            moodle-branch: MOODLE_405_STABLE
            database: mariadb
            mariadb_version: 10.11
    steps:
      - name: Check out repository code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@20529878ed81ef8e78ddf08b480401e6101a850f
        with:
          php-version: ${{ matrix.php }}
          extensions: >
            mbstring, intl, curl, dom, simplexml, xml, xmlwriter, xmlreader,
            zip, gd, exif, sodium, mysqli, pdo_mysql, pgsql, pdo_pgsql
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci add-plugin --branch master iarenaza/moodle-filter_multilang2

          if [ "${MOODLE_BRANCH}" = "MOODLE_502_STABLE" ]; then
            moodle-plugin-ci install \
              --plugin ./plugin \
              --db-host=127.0.0.1 \
              --no-init
          else
            moodle-plugin-ci install \
              --plugin ./plugin \
              --db-host=127.0.0.1
          fi
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          IGNORE_PATHS: moodle/tests/fixtures,moodle/Sniffs,classes/vendor
          CODECHECKER_IGNORE_PATHS: classes/vendor
          PHPDOCCHECKER_IGNORE_PATHS: classes/vendor
      # NEW: Explicitly initialize Behat so vendor/bin/behat exists
      - name: Initialize Behat
        run: |
          php admin/tool/behat/cli/init.php
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker --standard=.phpcs.xml.dist --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc

      - name: Validating
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      - name: Trace Node version
        run: node -v
      - name: Trace npm version
        run: npm -v
      - name: Trace Grunt version
        run: npx grunt --version

      - name: Grunt
        if: ${{ always() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 10

      - name: Direct Grunt Build & Diff Inspection
        if: ${{ always() }}
        run: |
          echo "=== Running Grunt directly inside Moodle ==="
          cd moodle

          # Determine the component path in classic vs public layout
          if [ -d "public/local/deepler" ]; then
            PLUGIN_PATH="public/local/deepler"
          else
            PLUGIN_PATH="local/deepler"
          fi

          # Compile AMD files directly
          npx grunt amd --files="$PLUGIN_PATH/amd/src/*.js,$PLUGIN_PATH/amd/src/**/*.js" --force || true

          echo "=== Diff between committed plugin and CI compiled output ==="
          git diff --no-index --stat ../plugin/amd/build/ "$PLUGIN_PATH/amd/build/" || true
          git diff --no-index ../plugin/amd/build/ "$PLUGIN_PATH/amd/build/" || true
      - name: PHPUnit tests
        if: ${{ always() }}
        env:
          DEEPL_API_TOKEN: ${{ secrets.DEEPL_API_TOKEN}}
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Behat features
        if: false
        continue-on-error: true  # Optional: you can also keep this if you want to make it clear it's temporarily disabled
        env:
          DEEPL_API_TOKEN: ${{ secrets.DEEPL_API_TOKEN}}
        run: moodle-plugin-ci behat --profile chrome --tags='@local_deepler&&~@envtest'
  testPG:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres_version }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.4
            moodle-branch: MOODLE_502_STABLE
            database: pgsql
            mariadb_version: 16
          - php: 8.3
            moodle-branch: MOODLE_502_STABLE
            database: pgsql
            mariadb_version: 16
          - php: 8.2
            moodle-branch: MOODLE_502_STABLE
            database: pgsql
            mariadb_version: 16
          - php: 8.4
            moodle-branch: MOODLE_501_STABLE
            database: pgsql
            postgres_version: 15
          - php: 8.3
            moodle-branch: MOODLE_501_STABLE
            database: pgsql
            postgres_version: 15
          - php: 8.2
            moodle-branch: MOODLE_501_STABLE
            database: pgsql
            postgres_version: 15
          - php: 8.4
            moodle-branch: MOODLE_500_STABLE
            database: pgsql
            postgres_version: 14
          - php: 8.3
            moodle-branch: MOODLE_500_STABLE
            database: pgsql
            postgres_version: 14
          - php: 8.2
            moodle-branch: MOODLE_500_STABLE
            database: pgsql
            postgres_version: 14
          - php: 8.3
            moodle-branch: MOODLE_405_STABLE
            database: pgsql
            postgres_version: 14
          - php: 8.2
            moodle-branch: MOODLE_405_STABLE
            database: pgsql
            postgres_version: 14
    steps:
      - name: Check out repository code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@20529878ed81ef8e78ddf08b480401e6101a850f
        with:
          php-version: ${{ matrix.php }}
          extensions: >
            mbstring, intl, curl, dom, simplexml, xml, xmlwriter, xmlreader,
            zip, gd, exif, sodium, mysqli, pdo_mysql, pgsql, pdo_pgsql
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci add-plugin --branch master iarenaza/moodle-filter_multilang2
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          IGNORE_PATHS: moodle/tests/fixtures,moodle/Sniffs,classes/vendor
          CODECHECKER_IGNORE_PATHS: classes/vendor
          PHPDOCCHECKER_IGNORE_PATHS: classes/vendor

      - name: PHP Lint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker --standard=.phpcs.xml.dist --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
