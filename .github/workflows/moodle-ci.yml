          git diff --no-index ../plugin/amd/build/ "$PLUGIN_PATH/amd/build/" || true
      - name: Initialize PHPUnit
        run: |
          php admin/tool/phpunit/cli/init.php
      - name: PHPUnit tests
        if: ${{ always() }}
        env:
          DEEPL_API_TOKEN: ${{ secrets.DEEPL_API_TOKEN}}
